<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechSolutions - Twoja Firma IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .animate-slide-in {
        animation: slide-in 0.6s ease-out;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #2563eb, #7c3aed);
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div id="app">
      <!-- Navigation -->
      <nav-component
        :is-mobile-menu-open="isMobileMenuOpen"
        @toggle-menu="toggleMobileMenu"
      ></nav-component>

      <!-- Hero Section -->
      <hero-section @scroll-to-contact="scrollToContact"></hero-section>

      <!-- Services Section -->
      <services-section></services-section>

      <!-- About Section -->
      <about-section></about-section>

      <!-- Team Section -->
      <team-section></team-section>

      <!-- Contact Section -->
      <contact-section ref="contactSection"></contact-section>

      <!-- Footer -->
      <footer-component></footer-component>
    </div>

    <!-- Import Components -->
    <script src="./components/NavComponent.js"></script>
    <script src="./components/HeroSection.js"></script>
    <script src="./components/ServicesSection.js"></script>
    <script src="./components/AboutSection.js"></script>
    <script src="./components/TeamSection.js"></script>
    <script src="./components/ContactSection.js"></script>
    <script src="./components/FooterComponent.js"></script>

    <!-- Main App -->
    <script>
      const { createApp } = Vue;

      // Main App
      createApp({
        components: {
          NavComponent,
          HeroSection,
          ServicesSection,
          AboutSection,
          TeamSection,
          ContactSection,
          FooterComponent,
        },
        data() {
          return {
            isMobileMenuOpen: false,
          };
        },
        methods: {
          toggleMobileMenu() {
            this.isMobileMenuOpen = !this.isMobileMenuOpen;
          },
          scrollToContact() {
            this.$refs.contactSection.$el.scrollIntoView({
              behavior: "smooth",
            });
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
