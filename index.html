<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechSolutions - Twoja Firma IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      @keyframes slide-in {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .animate-slide-in {
        animation: slide-in 0.6s ease-out;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #2563eb, #7c3aed);
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div id="app">
      <!-- Navigation -->
      <nav-component
        :is-mobile-menu-open="isMobileMenuOpen"
        @toggle-menu="toggleMobileMenu"
      ></nav-component>

      <!-- Hero Section -->
      <hero-section @scroll-to-contact="scrollToContact"></hero-section>

      <!-- Services Section -->
      <services-section></services-section>

      <!-- About Section -->
      <about-section></about-section>

      <!-- Team Section -->
      <team-section></team-section>

      <!-- Contact Section -->
      <contact-section ref="contactSection"></contact-section>

      <!-- Footer -->
      <footer-component></footer-component>
    </div>

    <script>
      const { createApp } = Vue;

      // Navigation Component
      const NavComponent = {
        props: ["isMobileMenuOpen"],
        emits: ["toggle-menu"],
        template: `
          <nav class="bg-gradient-to-r from-slate-900 via-blue-900 to-slate-900 backdrop-blur-lg shadow-2xl fixed w-full z-50 border-b border-blue-500/20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex justify-between h-20">
                <!-- Logo Section -->
                <div class="flex items-center">
                  <div class="flex-shrink-0 flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                      <span class="text-white font-bold text-lg">T</span>
                    </div>
                    <div class="flex flex-col">
                      <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                        TechSolutions
                      </span>
                      <span class="text-xs text-blue-300 tracking-wider">INNOVATION FIRST</span>
                    </div>
                  </div>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-1">
                  <a href="#home" class="relative px-4 py-2 text-blue-100 hover:text-white transition-all duration-300 group">
                    <span class="relative z-10">Strona główna</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20 rounded-lg scale-0 group-hover:scale-100 transition-transform duration-300"></div>
                  </a>
                  <a href="#services" class="relative px-4 py-2 text-blue-100 hover:text-white transition-all duration-300 group">
                    <span class="relative z-10">Usługi</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20 rounded-lg scale-0 group-hover:scale-100 transition-transform duration-300"></div>
                  </a>
                  <a href="#about" class="relative px-4 py-2 text-blue-100 hover:text-white transition-all duration-300 group">
                    <span class="relative z-10">O nas</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20 rounded-lg scale-0 group-hover:scale-100 transition-transform duration-300"></div>
                  </a>
                  <a href="#team" class="relative px-4 py-2 text-blue-100 hover:text-white transition-all duration-300 group">
                    <span class="relative z-10">Zespół</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20 rounded-lg scale-0 group-hover:scale-100 transition-transform duration-300"></div>
                  </a>
                  <a href="#contact" class="relative px-4 py-2 text-blue-100 hover:text-white transition-all duration-300 group">
                    <span class="relative z-10">Kontakt</span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600/20 to-purple-600/20 rounded-lg scale-0 group-hover:scale-100 transition-transform duration-300"></div>
                  </a>
                  
                  <!-- CTA Button -->
                  <div class="ml-6">
                    <button class="relative px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300 border border-blue-400/30">
                      <span class="relative z-10 flex items-center space-x-2">
                        <span>💬</span>
                        <span>Bezpłatna konsultacja</span>
                      </span>
                      <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-purple-700 rounded-xl opacity-0 hover:opacity-100 transition-opacity duration-300"></div>
                    </button>
                  </div>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden flex items-center">
                  <button @click="$emit('toggle-menu')" 
                          class="p-2 text-blue-200 hover:text-white hover:bg-blue-800/30 rounded-lg transition-all duration-300">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path v-if="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                      <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Mobile Menu -->
            <div v-if="isMobileMenuOpen" class="md:hidden">
              <div class="px-4 pt-4 pb-6 space-y-2 bg-gradient-to-b from-slate-900 to-blue-900 border-t border-blue-500/20 shadow-2xl">
                <a href="#home" class="block px-4 py-3 text-blue-100 hover:text-white hover:bg-blue-800/30 rounded-lg transition-all duration-300 transform hover:translate-x-2">
                  <span class="flex items-center space-x-3">
                    <span>🏠</span>
                    <span>Strona główna</span>
                  </span>
                </a>
                <a href="#services" class="block px-4 py-3 text-blue-100 hover:text-white hover:bg-blue-800/30 rounded-lg transition-all duration-300 transform hover:translate-x-2">
                  <span class="flex items-center space-x-3">
                    <span>⚙️</span>
                    <span>Usługi</span>
                  </span>
                </a>
                <a href="#about" class="block px-4 py-3 text-blue-100 hover:text-white hover:bg-blue-800/30 rounded-lg transition-all duration-300 transform hover:translate-x-2">
                  <span class="flex items-center space-x-3">
                    <span>📋</span>
                    <span>O nas</span>
                  </span>
                </a>
                <a href="#team" class="block px-4 py-3 text-blue-100 hover:text-white hover:bg-blue-800/30 rounded-lg transition-all duration-300 transform hover:translate-x-2">
                  <span class="flex items-center space-x-3">
                    <span>👥</span>
                    <span>Zespół</span>
                  </span>
                </a>
                <a href="#contact" class="block px-4 py-3 text-blue-100 hover:text-white hover:bg-blue-800/30 rounded-lg transition-all duration-300 transform hover:translate-x-2">
                  <span class="flex items-center space-x-3">
                    <span>📞</span>
                    <span>Kontakt</span>
                  </span>
                </a>
                
                <!-- Mobile CTA Button -->
                <div class="pt-4 border-t border-blue-500/20">
                  <button class="w-full px-6 py-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-xl shadow-lg">
                    <span class="flex items-center justify-center space-x-2">
                      <span>💬</span>
                      <span>Bezpłatna konsultacja</span>
                    </span>
                  </button>
                </div>
              </div>
            </div>
          </nav>
        `,
      };

      // Hero Section Component
      const HeroSection = {
        emits: ["scroll-to-contact"],
        data() {
          return {
            particles: Array.from({ length: 50 }, (_, i) => ({
              id: i,
              x: Math.random() * 100,
              y: Math.random() * 100,
              size: Math.random() * 4 + 1,
              duration: Math.random() * 20 + 10,
            })),
          };
        },
        template: `
          <section id="home" class="relative pt-20 bg-gradient-to-br from-slate-900 via-blue-900 to-purple-900 min-h-screen flex items-center overflow-hidden">
            <!-- Animated Background Particles -->
            <div class="absolute inset-0">
              <div v-for="particle in particles" :key="particle.id" 
                   class="absolute w-1 h-1 bg-blue-400/30 rounded-full animate-pulse"
                   :style="{
                     left: particle.x + '%',
                     top: particle.y + '%',
                     animationDelay: Math.random() * 2 + 's',
                     animationDuration: particle.duration + 's'
                   }">
              </div>
            </div>
            
            <!-- Gradient Overlays -->
            <div class="absolute inset-0 bg-gradient-to-r from-blue-600/10 to-purple-600/10"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/50 to-transparent"></div>
            
            <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
              <div class="text-center">
                <!-- Badge -->
                <div class="inline-flex items-center px-4 py-2 bg-blue-500/20 border border-blue-400/30 rounded-full text-blue-200 text-sm font-medium mb-8 backdrop-blur-sm">
                  <span class="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
                  Dostępni dla nowych projektów
                </div>
                
                <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight">
                  <span class="bg-gradient-to-r from-white via-blue-100 to-blue-200 bg-clip-text text-transparent">
                    Rozwijamy Twój
                  </span>
                  <br>
                  <span class="bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent animate-pulse">
                    Biznes
                  </span>
                  <br>
                  <span class="bg-gradient-to-r from-white via-blue-100 to-blue-200 bg-clip-text text-transparent">
                    z Pomocą Technologii
                  </span>
                </h1>
                
                <p class="text-xl md:text-2xl text-blue-100/80 mb-12 max-w-4xl mx-auto leading-relaxed">
                  Jesteśmy zespołem ekspertów IT, którzy pomagają firmom w 
                  <span class="text-blue-300 font-semibold">transformacji cyfrowej</span>. 
                  Tworzymy nowoczesne rozwiązania, które zwiększają efektywność i konkurencyjność.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-16">
                  <button @click="$emit('scroll-to-contact')" 
                          class="group relative px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white text-lg font-semibold rounded-2xl shadow-2xl hover:shadow-blue-500/25 transform hover:scale-105 transition-all duration-300 border border-blue-400/30">
                    <span class="relative z-10 flex items-center space-x-2">
                      <span>🚀</span>
                      <span>Rozpocznij Projekt</span>
                      <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                      </svg>
                    </span>
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-purple-700 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                  </button>
                  
                  <button class="group px-8 py-4 border-2 border-blue-400/50 text-blue-200 text-lg font-semibold rounded-2xl hover:bg-blue-500/10 hover:border-blue-300 transition-all duration-300 backdrop-blur-sm">
                    <span class="flex items-center space-x-2">
                      <span>📂</span>
                      <span>Zobacz Portfolio</span>
                      <svg class="w-5 h-5 transform group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                      </svg>
                    </span>
                  </button>
                </div>
                
                <!-- Stats Section -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-8 max-w-4xl mx-auto">
                  <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent mb-2">
                      150+
                    </div>
                    <div class="text-blue-200/70 text-sm">Projektów</div>
                  </div>
                  <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent mb-2">
                      50+
                    </div>
                    <div class="text-blue-200/70 text-sm">Klientów</div>
                  </div>
                  <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-pink-400 to-red-400 bg-clip-text text-transparent mb-2">
                      6
                    </div>
                    <div class="text-blue-200/70 text-sm">Lat</div>
                  </div>
                  <div class="text-center">
                    <div class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-green-400 to-blue-400 bg-clip-text text-transparent mb-2">
                      24/7
                    </div>
                    <div class="text-blue-200/70 text-sm">Wsparcie</div>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Scroll Indicator -->
            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2">
              <div class="flex flex-col items-center text-blue-200/60">
                <span class="text-sm mb-2">Przewiń w dół</span>
                <svg class="w-6 h-6 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                </svg>
              </div>
            </div>
          </section>
        `,
      };

      // Services Section Component
      const ServicesSection = {
        data() {
          return {
            services: [
              {
                icon: "💻",
                title: "Rozwój Aplikacji Web",
                description:
                  "Tworzymy nowoczesne aplikacje webowe przy użyciu najnowszych technologii jak Vue.js, React i Node.js.",
                gradient: "from-blue-500 to-purple-600",
                borderColor: "border-blue-500/20",
              },
              {
                icon: "📱",
                title: "Aplikacje Mobile",
                description:
                  "Projektujemy i rozwijamy aplikacje mobilne dla iOS i Android z naciskiem na doskonałe UX.",
                gradient: "from-purple-500 to-pink-600",
                borderColor: "border-purple-500/20",
              },
              {
                icon: "☁️",
                title: "Rozwiązania Cloud",
                description:
                  "Migrujemy infrastrukturę do chmury i optymalizujemy koszty oraz wydajność systemów.",
                gradient: "from-cyan-500 to-blue-600",
                borderColor: "border-cyan-500/20",
              },
              {
                icon: "🛡️",
                title: "Cyberbezpieczeństwo",
                description:
                  "Zabezpieczamy systemy przed zagrożeniami i przeprowadzamy audyty bezpieczeństwa.",
                gradient: "from-red-500 to-orange-600",
                borderColor: "border-red-500/20",
              },
              {
                icon: "🤖",
                title: "Automatyzacja Procesów",
                description:
                  "Automatyzujemy powtarzalne zadania i optymalizujemy procesy biznesowe.",
                gradient: "from-green-500 to-teal-600",
                borderColor: "border-green-500/20",
              },
              {
                icon: "📊",
                title: "Analityka Danych",
                description:
                  "Pomagamy w analizie danych i tworzeniu raportów biznesowych opartych na AI.",
                gradient: "from-indigo-500 to-purple-600",
                borderColor: "border-indigo-500/20",
              },
            ],
          };
        },
        template: `
          <section id="services" class="py-24 bg-gradient-to-b from-gray-50 to-white relative overflow-hidden">
            <!-- Background Pattern -->
            <div class="absolute inset-0 opacity-5">
              <div class="absolute inset-0" style="background-image: radial-gradient(circle at 1px 1px, rgba(59, 130, 246, 0.3) 1px, transparent 0); background-size: 50px 50px;"></div>
            </div>
            
            <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="text-center mb-20">
                <div class="inline-flex items-center px-4 py-2 bg-blue-100 text-blue-800 rounded-full text-sm font-medium mb-6">
                  <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                  Nasze Specjalności
                </div>
                
                <h2 class="text-4xl md:text-5xl font-bold mb-6">
                  <span class="bg-gradient-to-r from-gray-900 to-blue-800 bg-clip-text text-transparent">
                    Usługi IT Nowej Generacji
                  </span>
                </h2>
                <p class="text-xl text-gray-600 max-w-3xl mx-auto leading-relaxed">
                  Oferujemy kompleksowe rozwiązania IT dostosowane do potrzeb Twojej firmy. 
                  <span class="text-blue-600 font-semibold">Każdy projekt to unikalne wyzwanie</span>, 
                  które realizujemy z pasją i precyzją.
                </p>
              </div>
              
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div v-for="(service, index) in services" :key="service.title" 
                     class="group relative bg-white rounded-2xl p-8 shadow-lg hover:shadow-2xl transition-all duration-500 transform hover:-translate-y-4 border border-gray-100"
                     :class="service.borderColor"
                     :style="{ animationDelay: (index * 100) + 'ms' }">
                  
                  <!-- Gradient Background on Hover -->
                  <div class="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-500 rounded-2xl"
                       :class="'bg-gradient-to-br ' + service.gradient"></div>
                  
                  <!-- Icon Container -->
                  <div class="relative mb-6">
                    <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mb-4 transform group-hover:scale-110 transition-transform duration-300"
                         :class="'bg-gradient-to-br ' + service.gradient">
                      <span class="filter drop-shadow-sm">{{ service.icon }}</span>
                    </div>
                    
                    <!-- Floating Badge -->
                    <div class="absolute -top-2 -right-2 w-6 h-6 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                         :class="'bg-gradient-to-br ' + service.gradient">
                      <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                      </svg>
                    </div>
                  </div>
                  
                  <h3 class="text-xl font-bold text-gray-900 mb-4 group-hover:text-blue-600 transition-colors duration-300">
                    {{ service.title }}
                  </h3>
                  
                  <p class="text-gray-600 leading-relaxed mb-6">
                    {{ service.description }}
                  </p>
                  
                  <!-- CTA Link -->
                  <div class="flex items-center text-blue-600 font-semibold opacity-0 group-hover:opacity-100 transform translate-y-2 group-hover:translate-y-0 transition-all duration-300">
                    <span class="mr-2">Dowiedz się więcej</span>
                    <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                  </div>
                  
                  <!-- Corner Decoration -->
                  <div class="absolute top-4 right-4 w-20 h-20 opacity-10 group-hover:opacity-20 transition-opacity duration-300">
                    <div class="w-full h-full rounded-full opacity-30"
                         :class="'bg-gradient-to-br ' + service.gradient"></div>
                  </div>
                </div>
              </div>
              
              <!-- Bottom CTA -->
              <div class="text-center mt-16">
                <p class="text-gray-600 mb-6">Nie znalazłeś tego czego szukasz?</p>
                <button class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-2xl hover:from-blue-700 hover:to-purple-700 transform hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl">
                  <span class="mr-2">💬</span>
                  <span>Skonsultuj swój projekt</span>
                  <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                  </svg>
                </button>
              </div>
            </div>
          </section>
        `,
      };

      // About Section Component
      const AboutSection = {
        data() {
          return {
            stats: [
              {
                number: "150+",
                label: "Zrealizowanych Projektów",
                icon: "🚀",
                color: "from-blue-500 to-cyan-500",
              },
              {
                number: "50+",
                label: "Zadowolonych Klientów",
                icon: "🤝",
                color: "from-purple-500 to-pink-500",
              },
              {
                number: "6",
                label: "Lat Doświadczenia",
                icon: "⭐",
                color: "from-yellow-500 to-orange-500",
              },
              {
                number: "24/7",
                label: "Wsparcie Techniczne",
                icon: "🛠️",
                color: "from-green-500 to-teal-500",
              },
            ],
            features: [
              "Doświadczony zespół ekspertów",
              "Najnowsze technologie i metodologie",
              "Terminowa realizacja projektów",
              "Konkurencyjne ceny",
              "Długoterminowe wsparcie",
            ],
          };
        },
        template: `
          <section id="about" class="py-24 bg-gradient-to-b from-slate-50 to-blue-50 relative overflow-hidden">
            <!-- Background Decorations -->
            <div class="absolute top-0 left-0 w-96 h-96 bg-blue-200/20 rounded-full -translate-x-1/2 -translate-y-1/2 blur-3xl"></div>
            <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-200/20 rounded-full translate-x-1/2 translate-y-1/2 blur-3xl"></div>
            
            <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                <!-- Left Content -->
                <div class="space-y-8">
                  <div>
                    <div class="inline-flex items-center px-4 py-2 bg-blue-100 text-blue-800 rounded-full text-sm font-medium mb-6">
